# ==============================================================
# Nginx — tomnyambu.dev
# CHANGES FROM ORIGINAL (SEO & hardening only, no functional changes):
#
#  1. www → non-www canonical redirect (prevents duplicate content /
#     PageRank splitting across www and non-www)
#  2. Added gzip compression (faster loads = better Core Web Vitals)
#  3. Added security headers (HSTS, X-Frame-Options, X-Content-Type,
#     Referrer-Policy, Permissions-Policy)
#  4. TLS hardened: pinned to TLSv1.2 + TLSv1.3, strong ciphers,
#     session cache enabled
#  5. Explicit robots.txt + sitemap.xml blocks: correct Content-Type,
#     no-cache so crawlers always get the latest version
#  6. index.html served with no-cache — critical for Vite SPA;
#     without this, users and bots may get a stale shell after deploys
#  7. Vite hashed assets upgraded: added `immutable` flag (safe because
#     Vite fingerprints filenames on every build)
#  8. Hidden file block extended to cover .git, .env, dot-anything
# ==============================================================


# ── 1. HTTP → HTTPS (unchanged) ────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name tomnyambu.dev www.tomnyambu.dev;
    return 301 https://$host$request_uri;
}


# ── 2. NEW: www → non-www canonical redirect ───────────────────
# Ensures Google only indexes tomnyambu.dev, not www.tomnyambu.dev
# Prevents PageRank from being split across two identical domains.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tomnyambu.dev;

    ssl_certificate     /etc/letsencrypt/live/tomnyambu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tomnyambu.dev/privkey.pem;

    return 301 https://tomnyambu.dev$request_uri;
}


# ── 3. Main HTTPS server block ─────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tomnyambu.dev;

    # ── SSL (unchanged paths, hardened config) ──────────────────
    ssl_certificate     /etc/letsencrypt/live/tomnyambu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tomnyambu.dev/privkey.pem;

    # ADDED: Pin protocols and ciphers — drops SSLv3/TLSv1.0/1.1
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    root  /home/portfolio/dist;
    index index.html;

    # ── ADDED: Gzip compression ─────────────────────────────────
    # Reduces HTML/CSS/JS transfer size by ~70%; improves LCP and TTFB.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        font/woff
        font/woff2
        image/svg+xml;

    # ── ADDED: Security + SEO headers ───────────────────────────
    # HSTS: forces HTTPS for 1 year; qualifies for browser preload list
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Prevents clickjacking (also a Google trust signal)
    add_header X-Frame-Options            "SAMEORIGIN"              always;
    # Prevents MIME-type sniffing attacks
    add_header X-Content-Type-Options     "nosniff"                 always;
    # Controls referrer data sent to third parties
    add_header Referrer-Policy            "no-referrer-when-downgrade" always;
    # Disables unnecessary browser features (privacy + trust signal)
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;

    # ── ADDED: robots.txt — no-cache, correct MIME ──────────────
    # Without this, Nginx may serve it with wrong Content-Type or
    # cache an old version, causing crawlers to use stale rules.
    location = /robots.txt {
        try_files $uri =404;
        add_header Content-Type  "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        access_log     off;
        log_not_found  off;
    }

    # ── ADDED: sitemap.xml — no-cache, correct MIME ─────────────
    location = /sitemap.xml {
        try_files $uri =404;
        add_header Content-Type  "application/xml; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        access_log     off;
        log_not_found  off;
    }

    # ── Vite SPA fallback (unchanged behaviour) ──────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # ADDED: index.html must never be cached.
        # Vite injects new hashed asset filenames into index.html on
        # every build. If a browser or CDN caches index.html, users
        # (and Googlebot) get the old shell pointing at deleted assets.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── Vite hashed static assets (upgraded) ────────────────────
    # Original: expires 6M — fine but missing `immutable`.
    # Added `immutable`: tells browsers never to revalidate these files.
    # Safe because Vite fingerprints every filename (e.g. main.a3f9c2.js).
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|ttf|svg|eot|otf|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── IMPROVED: Block ALL hidden/dot files ────────────────────
    # Original only blocked .ht* — this covers .env, .git, .DS_Store etc.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/tomnyambu_ssl_access.log;
    error_log  /var/log/nginx/tomnyambu_ssl_error.log;
}