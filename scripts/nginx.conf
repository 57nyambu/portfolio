# ==============================================================
# Nginx — tomnyambu.dev
# ==============================================================

# ── 1. HTTP → HTTPS ───────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name tomnyambu.dev www.tomnyambu.dev;

    return 301 https://$host$request_uri;
}


# ── 2. www → non-www canonical redirect ───────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tomnyambu.dev;

    ssl_certificate     /etc/letsencrypt/live/tomnyambu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tomnyambu.dev/privkey.pem;

    return 301 https://tomnyambu.dev$request_uri;
}


# ── 3. Main HTTPS server block ─────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tomnyambu.dev;

    # ── SSL Hardening ──────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/tomnyambu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tomnyambu.dev/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root  /home/portfolio/dist;
    index index.html;

    # ── Gzip compression ───────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        font/woff
        font/woff2
        image/svg+xml;

    # ── Security + SEO headers ─────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                  always;
    add_header X-Content-Type-Options     "nosniff"                     always;
    add_header Referrer-Policy            "no-referrer-when-downgrade" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;

    # ── robots.txt ─────────────────────────────────────────────
    location = /robots.txt {
        try_files $uri =404;
        add_header Content-Type  "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        access_log    off;
        log_not_found off;
    }

    # ── sitemap.xml ────────────────────────────────────────────
    location = /sitemap.xml {
        try_files $uri =404;
        add_header Content-Type  "application/xml; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        access_log    off;
        log_not_found off;
    }

    # ── Vite SPA fallback ──────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── Vite hashed static assets ──────────────────────────────
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|ttf|svg|eot|otf|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Block hidden files ─────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/tomnyambu_ssl_access.log;
    error_log  /var/log/nginx/tomnyambu_ssl_error.log;
}
